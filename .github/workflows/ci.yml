name: Browser workflow checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Baseline browser scenarios
        run: npm test
      - name: Deliberate defect detection
        run: npm run test:mutations
      - name: Restore and verify clean baseline
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-evidence
          path: |
            artifacts/
            playwright-report/
            test-results/
          retention-days: 7
